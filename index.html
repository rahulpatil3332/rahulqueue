
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Queue – Visualization App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        .circular-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        /* Base Reveal Class - Optimized for replay */
        .reveal-base {
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity, filter;
        }

        /* 1. Slide Left Reveal */
        .reveal-slide-left { transform: translateX(-80px); }
        .reveal-slide-left.is-visible { opacity: 1; transform: translateX(0); }

        /* 2. Scale Up Reveal */
        .reveal-scale { transform: scale(0.85); }
        .reveal-scale.is-visible { opacity: 1; transform: scale(1); }

        /* 3. Slide Right Reveal */
        .reveal-slide-right { transform: translateX(80px); }
        .reveal-slide-right.is-visible { opacity: 1; transform: translateX(0); }

        /* 4. Blur Reveal */
        .reveal-blur { filter: blur(15px); transform: translateY(30px); }
        .reveal-blur.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }

        /* 5. Flip Reveal */
        .reveal-flip { transform: perspective(1000px) rotateX(-25deg); transform-origin: top; }
        .reveal-flip.is-visible { opacity: 1; transform: perspective(1000px) rotateX(0); }

        /* 6. Zoom Out Reveal */
        .reveal-zoom-out { transform: scale(1.1); }
        .reveal-zoom-out.is-visible { opacity: 1; transform: scale(1); }

        /* 7. Slide Up Reveal */
        .reveal-slide-up { transform: translateY(60px); }
        .reveal-slide-up.is-visible { opacity: 1; transform: translateY(0); }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
